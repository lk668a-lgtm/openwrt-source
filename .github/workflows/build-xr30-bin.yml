name: BUER-WRT XR30 (BIN)

# 目标：出 CMCC XR30 的 .bin 固件（原厂 MTK U-Boot / UBI 布局，sysupgrade.bin），
# 插件与主题内置，功能与 .itb 版完全一致。
# 基线固定 immortalwrt@0c4cd0f9920a —— 与实机当前 r38135 完全同一提交，
# 免得版本漂移把驱动/包版本带偏。

on:
  push:
    branches: [buer-wrt]
    paths:
      - 'xr30-build/**'
      # 设备定义/镜像规则改动也要重编（DEVICE_PACKAGES、IMAGES 之类都在这）
      - 'target/linux/mediatek/**'
      - 'package/luci-app-tkproxy/**'
      - 'package/luci-theme-argon/**'
      - 'package/luci-app-buerwrt-ads/**'
      - 'files/**'
      - '.github/workflows/build-xr30-bin.yml'
  workflow_dispatch:
    inputs:
      variant:
        description: '要编译的变体'
        required: true
        default: 'both'
        type: choice
        options: [both, minimal, full]

permissions:
  contents: write

concurrency:
  group: buer-wrt-bin-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_COMMIT: 0c4cd0f9920a420a2ac95b49c1b62130769c08ae
  TZ: Asia/Shanghai

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      variants: ${{ steps.m.outputs.variants }}
    steps:
      - id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.variant }}" != "both" ]; then
            echo 'variants=["${{ inputs.variant }}"]' >> $GITHUB_OUTPUT
          else
            echo 'variants=["full"]' >> $GITHUB_OUTPUT
          fi

  build:
    # 预检仅作参考，不阻塞正式编译（预检自身依赖宿主环境，失败不代表 DTS 有问题）
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.prepare.outputs.variants) }}
    runs-on: ubuntu-22.04
    name: build-${{ matrix.variant }}
    steps:
      - name: 检出构建仓
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq
          sudo apt-get install -y -qq ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libssl-dev \
            libtool lrzsz mkisofs msmtp nano ninja-build p7zip-full patch pkgconf python3 python3-pip \
            python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: 拉取 immortalwrt 源码（锁定提交）
        run: |
          # 注意：git fetch 只认完整 40 位 SHA，短哈希会报
          # "couldn't find remote ref"，第一次编译就栽在这。
          set -e
          git init openwrt
          cd openwrt
          git remote add origin $REPO_URL
          if git fetch --depth 1 origin $REPO_COMMIT; then
            git checkout FETCH_HEAD
          else
            echo "按 SHA 拉取失败，退回 blobless 全量索引"
            rm -rf .git
            cd ..
            rm -rf openwrt
            git clone --filter=blob:none --no-checkout $REPO_URL openwrt
            cd openwrt
            git checkout $REPO_COMMIT
          fi
          echo "实际提交：$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$REPO_COMMIT" || { echo "::error::提交号不一致"; exit 1; }

      - name: 注入 XR30 设备定义
        run: |
          cp xr30-build/dts/*.dts openwrt/target/linux/mediatek/dts/
          python3 xr30-build/patch_device.py openwrt
          grep -n "Device/cmcc_xr30" openwrt/target/linux/mediatek/image/filogic.mk

      - name: 放入品牌文件与插件包
        run: |
          mkdir -p openwrt/files
          cp -rv files/* openwrt/files/ || true
          cp -rv package/luci-app-tkproxy openwrt/package/
          # luci-theme-argon / luci-app-argon-config 不再单独入树：
          # 插件包已内置主题；两份同名文件会让 package/install 报 check_data_file_clashes。
          cp -rv package/luci-app-buerwrt-ads openwrt/package/ || true

      - name: 更新 feeds 并安装
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成 .config
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_xr30_nand=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=104
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_jsonfilter=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nf-tproxy=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_luci-lua-runtime=y
          EOF
          if [ "${{ matrix.variant }}" = "full" ]; then
            cat >> .config <<'EOF'
          # 主题由 luci-app-tkproxy 自带（3.15.3 起合并了 Argon），
          # 不能再选独立的 luci-theme-argon / luci-app-argon-config：
          # 两者装同一批 /www/luci-static/argon/** → package/install 阶段 file clash。
          CONFIG_PACKAGE_luci-app-tkproxy=y
          EOF
          fi
          make defconfig
          echo "=== 机型断言 ==="
          grep -q 'CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_xr30_nand=y' .config || { echo "::error::没选中 cmcc_xr30_nand"; exit 1; }
          grep -q 'CONFIG_TARGET_MULTI_PROFILE=y' .config && { echo "::error::MULTI_PROFILE 被打开"; exit 1; }
          if [ "${{ matrix.variant }}" = "full" ]; then
            grep -q 'CONFIG_PACKAGE_luci-app-tkproxy=y' .config || { echo "::error::插件没被选中"; exit 1; }
            grep -q 'CONFIG_PACKAGE_luci-theme-argon=y' .config && { echo "::error::不该再单独选主题包（会与插件自带的 Argon 冲突）"; exit 1; } || true
          fi
          echo "配置检查通过"

      - name: 缓存源码包
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ hashFiles('openwrt/.config') }}-v1

      - name: 下载源码包
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: 编译
        run: |
          cd openwrt
          make -j$(nproc)

      - name: 校验产物（必须是 XR30 的 itb）
        run: |
          ls -l openwrt/bin/targets/mediatek/filogic/
          test -f openwrt/bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-cmcc_xr30-nand-squashfs-sysupgrade.bin \
            || { echo "::error::没有产出 cmcc_xr30-nand 的 sysupgrade.bin"; exit 1; }


      - name: 失败自诊断（写进 job summary）
        if: failure()
        run: |
          set +e
          OUT=/tmp/err.txt
          : > $OUT
          echo "### ${{ matrix.variant }} 变体失败" >> $OUT
          echo "" >> $OUT
          echo '```' >> $OUT
          # OpenWrt 的失败原因一般在 logs/ 下
          grep -rlE "\*\*\* \[.*\] Error|ERROR:|Error [0-9]|No rule to make|undefined reference" openwrt/logs 2>/dev/null | head -5 > /tmp/files.txt
          while read -r f; do
            echo "== $f ==" >> $OUT
            tail -n 60 "$f" >> $OUT
          done < /tmp/files.txt
          if [ ! -s /tmp/files.txt ]; then
            echo "== 未在 logs/ 命中关键字，附最近修改的日志 ==" >> $OUT
            ls -t openwrt/logs/*/*.txt 2>/dev/null | head -3 | while read -r f; do
              echo "== $f ==" >> $OUT
              tail -n 40 "$f" >> $OUT
            done
          fi
          echo '```' >> $OUT
          tail -c 60000 $OUT > /tmp/err2.txt
          { echo "## ❌ 编译失败：${{ matrix.variant }}"; echo '```'; cat /tmp/err2.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
          echo "===== 失败日志（stdout，匿名可见） ====="
          cat /tmp/err2.txt | tail -60
          echo "::error::编译失败，详见 job summary"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: bwerwrt-xr30-${{ matrix.variant }}
          path: |
            openwrt/bin/targets/mediatek/filogic/*cmcc_xr30-nand*
            openwrt/bin/targets/mediatek/filogic/profiles.json
          if-no-files-found: error

      # 正式版也要能公开下载：artifact 需要登录，客户拿不到。
      # 打成 Release（tag: full-<时间戳>），和快车道一致，免登录直接下。
      - name: 发布到 Release（正式版）
        if: matrix.variant == 'full'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TS=$(date -u +%Y%m%d-%H%M%S)
          TAG="bin-${TS}"
          cd openwrt/bin/targets/mediatek/filogic
          ITB=$(ls *cmcc_xr30-nand*sysupgrade.bin 2>/dev/null | head -1 || true)
          [ -n "$ITB" ] || { echo "没找到 cmcc_xr30-nand sysupgrade.bin"; exit 1; }
          SHA=$(sha256sum "$ITB" | awk '{print $1}')
          SIZE=$(stat -c %s "$ITB")
          echo "产物：$ITB  $SIZE 字节  sha256=$SHA"
          {
            echo "## BUER-WRT XR30 正式版（BIN / 原厂 U-Boot）"
            echo ""
            echo "- 机型：cmcc_xr30-nand（原厂 MTK U-Boot / UBI 布局，.bin 格式）"
            echo "- 插件：3.15.11（含本轮 10 项修复）"
            echo "- 文件：\`$ITB\`"
            echo "- 大小：$SIZE 字节"
            echo "- sha256：\`$SHA\`"
            echo "- commit：${{ github.sha }}"
            echo ""
            echo "### 刷机方式"
            echo "1. 进 U-Boot 网页（设备断电→按住 reset 上电→浏览器开 192.168.1.1）"
            echo "2. 上传这个 .bin，等 3-5 分钟自动重启"
            echo "3. 后台 http://192.168.8.1  root/password"
            echo "4. WiFi：Buer-Wrt / Buer-Wrt-5G（密码 12345678）"
            echo "5. 服务 → 多线路分流 → 输卡密激活 → 导入节点 → 建 WiFi → 部署"
          } > /tmp/notes.md
          RES=$(curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"BUER-WRT XR30 正式版（BIN）$TS\",\"body\":\"$(sed ':a;N;$!ba;s/\n/\\n/g' /tmp/notes.md | sed 's/"/\\"/g')\"}")
          UPLOAD=$(echo "$RES" | python3 -c "import sys,json;print(json.load(sys.stdin).get('upload_url','').split('{')[0])")
          [ -n "$UPLOAD" ] || { echo "$RES"; exit 1; }
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" --data-binary @"$ITB" \
            "$UPLOAD?name=$ITB"
          echo "已发布：https://github.com/${{ github.repository }}/releases/tag/$TAG"
