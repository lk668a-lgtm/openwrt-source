name: BUER-WRT XR30

# 目标：出 CMCC XR30（ubootmod / FIT .itb）固件，插件与主题内置。
# 基线固定 immortalwrt@0c4cd0f9920a —— 与实机当前 r38135 完全同一提交，
# 免得版本漂移把驱动/包版本带偏。

on:
  push:
    branches: [buer-wrt]
    paths:
      - 'xr30-build/**'
      - '.github/workflows/build-xr30.yml'
  workflow_dispatch:
    inputs:
      variant:
        description: '要编译的变体'
        required: true
        default: 'both'
        type: choice
        options: [both, minimal, full]

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_COMMIT: 0c4cd0f9920a420a2ac95b49c1b62130769c08ae
  TZ: Asia/Shanghai

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      variants: ${{ steps.m.outputs.variants }}
    steps:
      - id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.variant }}" != "both" ]; then
            echo 'variants=["${{ inputs.variant }}"]' >> $GITHUB_OUTPUT
          else
            echo 'variants=["minimal","full"]' >> $GITHUB_OUTPUT
          fi

  # 3 分钟预检：只验证 DTS 能否编出 dtb。dtc 的错误在整包编译里要等 2 小时才暴露，
  # 这里几分钟就能拦住（dts 里标签引用不存在、语法错、缺 include 都能查出来）。
  dts-check:
    runs-on: ubuntu-22.04
    name: dts-check
    steps:
      - name: 检出构建仓
        uses: actions/checkout@v4

      - name: 拉取 immortalwrt 源码（只要 dts 目录）
        run: |
          set -e
          git init src
          cd src
          git remote add origin $REPO_URL
          git fetch --depth 1 origin $REPO_COMMIT
          git checkout FETCH_HEAD -- target/linux/mediatek/dts include

      - name: 用宿主 dtc 预编译 XR30 的 dtb
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq device-tree-compiler cpp
          cp xr30-build/dts/*.dts src/target/linux/mediatek/dts/
          cd src/target/linux/mediatek/dts
          cpp -nostdinc -undef -D__DTS__ -x assembler-with-cpp \
              -I../../../../include -I. mt7981b-cmcc-xr30.dts -o /tmp/xr30.dts.pp
          dtc -I dts -O dtb -o /tmp/xr30.dtb -i . /tmp/xr30.dts.pp 2> /tmp/dtc.err || {
            echo "::error::DTS 编译失败"; cat /tmp/dtc.err; exit 1;
          }
          echo "dtb 编译成功：$(stat -c%s /tmp/xr30.dtb) 字节"
          echo '--- 关键属性核对 ---'
          fdtget /tmp/xr30.dtb / model
          fdtget /tmp/xr30.dtb / compatible
          fdtget /tmp/xr30.dtb /chosen bootargs-override

      - name: 预检失败时报告（贴 issue）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          { echo '```'; echo '== cpp/dtc 输出 =='; cat /tmp/dtc.err 2>/dev/null | tail -40;
            echo '== 预处理产物尾部 =='; tail -20 /tmp/xr30.dts.pp 2>/dev/null;
            echo '```'; } > /tmp/e.txt
          jq -n --arg t "dts-check 失败 @ ${{ github.sha }}" --rawfile b /tmp/e.txt '{title:$t, body:$b}' > /tmp/p.json
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues -d @/tmp/p.json | head -c 200

  build:
    # 预检仅作参考，不阻塞正式编译（预检自身依赖宿主环境，失败不代表 DTS 有问题）
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.prepare.outputs.variants) }}
    runs-on: ubuntu-22.04
    name: build-${{ matrix.variant }}
    steps:
      - name: 检出构建仓
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq
          sudo apt-get install -y -qq ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libssl-dev \
            libtool lrzsz mkisofs msmtp nano ninja-build p7zip-full patch pkgconf python3 python3-pip \
            python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: 拉取 immortalwrt 源码（锁定提交）
        run: |
          # 注意：git fetch 只认完整 40 位 SHA，短哈希会报
          # "couldn't find remote ref"，第一次编译就栽在这。
          set -e
          git init openwrt
          cd openwrt
          git remote add origin $REPO_URL
          if git fetch --depth 1 origin $REPO_COMMIT; then
            git checkout FETCH_HEAD
          else
            echo "按 SHA 拉取失败，退回 blobless 全量索引"
            rm -rf .git
            cd ..
            rm -rf openwrt
            git clone --filter=blob:none --no-checkout $REPO_URL openwrt
            cd openwrt
            git checkout $REPO_COMMIT
          fi
          echo "实际提交：$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$REPO_COMMIT" || { echo "::error::提交号不一致"; exit 1; }

      - name: 注入 XR30 设备定义
        run: |
          cp xr30-build/dts/*.dts openwrt/target/linux/mediatek/dts/
          python3 xr30-build/patch_device.py openwrt
          grep -n "Device/cmcc_xr30" openwrt/target/linux/mediatek/image/filogic.mk

      - name: 放入品牌文件与插件包
        run: |
          mkdir -p openwrt/files
          cp -rv files/* openwrt/files/ || true
          cp -rv package/luci-app-tkproxy openwrt/package/
          cp -rv package/luci-theme-argon openwrt/package/
          cp -rv package/luci-app-argon-config openwrt/package/
          cp -rv package/luci-app-buerwrt-ads openwrt/package/ || true

      - name: 更新 feeds 并安装
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成 .config
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_xr30=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=104
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_jsonfilter=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_dnsmasq-full=y
          EOF
          if [ "${{ matrix.variant }}" = "full" ]; then
            cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-app-tkproxy=y
          EOF
          fi
          make defconfig
          echo "=== 机型断言 ==="
          grep -q 'CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_xr30=y' .config || { echo "::error::没选中 cmcc_xr30"; exit 1; }
          grep -q 'CONFIG_TARGET_MULTI_PROFILE=y' .config && { echo "::error::MULTI_PROFILE 被打开"; exit 1; }
          if [ "${{ matrix.variant }}" = "full" ]; then
            grep -q 'CONFIG_PACKAGE_luci-app-tkproxy=y' .config || { echo "::error::插件没被选中"; exit 1; }
            grep -q 'CONFIG_PACKAGE_luci-theme-argon=y' .config || { echo "::error::主题没被选中"; exit 1; }
          fi
          echo "配置检查通过"

      - name: 缓存源码包
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ hashFiles('openwrt/.config') }}-v1

      - name: 下载源码包
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: 编译
        run: |
          cd openwrt
          make -j$(nproc)

      - name: 校验产物（必须是 XR30 的 itb）
        run: |
          ls -l openwrt/bin/targets/mediatek/filogic/
          test -f openwrt/bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-cmcc_xr30-squashfs-sysupgrade.itb \
            || { echo "::error::没有产出 cmcc_xr30 的 sysupgrade.itb"; exit 1; }


      - name: 失败自诊断（把日志贴到 issue）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          OUT=/tmp/err.txt
          : > $OUT
          echo "### ${{ matrix.variant }} 变体失败" >> $OUT
          echo "" >> $OUT
          echo '```' >> $OUT
          # OpenWrt 的失败原因一般在 logs/ 下
          grep -rlE "\*\*\* \[.*\] Error|ERROR:|Error [0-9]|No rule to make|undefined reference" openwrt/logs 2>/dev/null | head -5 > /tmp/files.txt
          while read -r f; do
            echo "== $f ==" >> $OUT
            tail -n 60 "$f" >> $OUT
          done < /tmp/files.txt
          if [ ! -s /tmp/files.txt ]; then
            echo "== 未在 logs/ 命中关键字，附最近修改的日志 ==" >> $OUT
            ls -t openwrt/logs/*/*.txt 2>/dev/null | head -3 | while read -r f; do
              echo "== $f ==" >> $OUT
              tail -n 40 "$f" >> $OUT
            done
          fi
          echo '```' >> $OUT
          tail -c 60000 $OUT > /tmp/err2.txt
          jq -n --arg t "CI 失败：${{ matrix.variant }} @ ${{ github.sha }}" --rawfile b /tmp/err2.txt \
            '{title:$t, body:$b}' > /tmp/payload.json
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues -d @/tmp/payload.json | head -c 300

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: bwerwrt-xr30-${{ matrix.variant }}
          path: |
            openwrt/bin/targets/mediatek/filogic/*cmcc_xr30*
            openwrt/bin/targets/mediatek/filogic/profiles.json
          if-no-files-found: error
