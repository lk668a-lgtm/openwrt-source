name: build-buer-wrt

# 已停用自动触发：改为只支持手动（旧流程编译的是 shiyu1314 源码、产物是 .bin，
# 与本机 U-Boot mod 需要的 .itb 不匹配，见 build-xr30.yml）
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 腾出磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget \
            libelf-dev ecj fastjar java-propose-classpath subversion swig upx-ucl

      - name: 更新 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置
        run: |
          cp configs/buer-wrt.config .config
          make defconfig
          if ! grep -q "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_xr30-nand=y" .config; then
            echo "第一次没选中设备，按 profile 再生成一次"
            sed -i '/^CONFIG_TARGET_PROFILE=/d' .config
            echo 'CONFIG_TARGET_PROFILE="DEVICE_cmcc_xr30-nand"' >> .config
            make defconfig
          fi
          echo "=== 设备检查 ==="
          grep -E "CONFIG_TARGET_DEVICE|CONFIG_TARGET_mediatek" .config | head -20
          grep -q "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_xr30-nand=y" .config \
            || { echo "错误：没有选中 cmcc_xr30-nand，停止编译"; exit 1; }
          echo "=== 包检查 ==="
          grep -E "CONFIG_PACKAGE_(xray-core|luci-app-tkproxy|luci-app-buerwrt-ads|luci-theme-argon|luci-app-argon-config|ip-full|luci-compat)=" .config \
            || { echo "错误：关键包缺失"; exit 1; }

      - name: 下载源码包
        run: make download -j8 || make download -j1 V=s

      - name: 编译
        run: make -j$(nproc) || make -j1 V=s

      - name: 整理产物
        run: |
          mkdir -p out
          ls -lh bin/targets/mediatek/filogic/ || true
          for f in bin/targets/mediatek/filogic/*cmcc_xr30-nand*; do
            [ -f "$f" ] || continue
            cp "$f" "out/buer-wrt-$(basename "$f")"
          done
          echo "=== 最终产物 ==="
          ls -lh out/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: buer-wrt-cmcc_xr30-nand
          if-no-files-found: error
          path: |
            out/*
            bin/targets/mediatek/filogic/*.manifest
