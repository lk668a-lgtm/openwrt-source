name: BUER-WRT XR30 PassWall(25.12.16)

# 目的：出「内置老版 PassWall」的 XR30 固件。
# 为什么用 24.10.3 基底：老版 PassWall 25.12.16 只存在于 24.10 的软件源；
# 25.12 源里只有 26.10.29（新版，界面是两页那种）。老版按 LuCI 24.10 编写，
# 在 24.10 基底下界面与行为才完整正常。
#
# 快车道：官方 ImageBuilder（预编译内核 + 包仓库），约 5~10 分钟出 itb。

on:
  workflow_dispatch:
  push:
    branches: [buer-wrt]
    paths:
      - '.github/workflows/build-xr30-passwall.yml'
      - 'xr30-build/**'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build-passwall:
    runs-on: ubuntu-22.04
    name: imagebuilder-2410-passwall
    steps:
      - name: 检出构建仓
        uses: actions/checkout@v4

      - name: 下载并解压 ImageBuilder 24.10.3
        run: |
          set -e
          URL=https://downloads.immortalwrt.org/releases/24.10.3/targets/mediatek/filogic/immortalwrt-imagebuilder-24.10.3-mediatek-filogic.Linux-x86_64.tar.zst
          curl -sSL -o ib.tar.zst "$URL"
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          tar --use-compress-program=unzstd -xf ib.tar.zst
          ls -d immortalwrt-imagebuilder-*

      - name: 组装内置文件树（tkproxy 插件 + Argon 主题 + 品牌）
        run: |
          set -e
          sh xr30-build/make-files.sh /tmp/files-install
          echo "文件数：$(find /tmp/files-install -type f | wc -l)"
          test -f /tmp/files-install/usr/libexec/tkproxy/watchdog.sh || { echo "::error::插件里没有 watchdog.sh"; exit 1; }

      - name: 用 luci-app-tkproxy 3.15.42 的 ipk 覆盖插件（去掉源码树里的旧文件）
        run: |
          set -e
          IPK=$(ls xr30-build/pkgs/luci-app-tkproxy_3.15.42-1_all.ipk)
          sha256sum "$IPK"
          echo "a0b33f6fc1456e356283d0fd9bcf797585d64aa49149c97e63bff7709c306ea8  $IPK" | sha256sum -c - || { echo "::error::ipk sha256 不匹配"; exit 1; }
          # 先把源码树复制进来的旧插件文件删干净，避免版本混杂
          rm -rf /tmp/files-install/usr/libexec/tkproxy \
                 /tmp/files-install/usr/lib/lua/luci/model/tkproxy \
                 /tmp/files-install/usr/lib/lua/luci/view/tkproxy \
                 /tmp/files-install/usr/lib/lua/luci/controller/tkproxy.lua \
                 /tmp/files-install/usr/lib/lua/luci/controller/tkproxy_bind.lua \
                 /tmp/files-install/usr/lib/lua/luci/controller/tkproxy_preflight.lua \
                 /tmp/files-install/usr/share/tkproxy \
                 /tmp/files-install/usr/share/luci/menu.d/luci-app-tkproxy.json \
                 /tmp/files-install/usr/share/rpcd/acl.d/luci-app-tkproxy.json \
                 /tmp/files-install/www/luci-static/resources/tkproxy \
                 /tmp/files-install/www/luci-static/resources/view/tkproxy
          rm -f  /tmp/files-install/etc/uci-defaults/90-tkproxy-update \
                 /tmp/files-install/etc/uci-defaults/91-tkproxy-bootfix \
                 /tmp/files-install/etc/uci-defaults/99-tkproxy-argon-light
          # 解包 ipk：ar 归档 → data.tar.gz → 铺到 FILES 目录
          rm -rf /tmp/ipkx && mkdir -p /tmp/ipkx
          cd /tmp/ipkx
          # 这个 ipk 是 tar.gz 打包（不是 Debian ar），按魔数自动判断
          if tar tzf "$GITHUB_WORKSPACE/$IPK" >/dev/null 2>&1; then
            echo "ipk 格式: tar.gz"
            tar xzf "$GITHUB_WORKSPACE/$IPK"
          else
            echo "ipk 格式: ar"
            ar x "$GITHUB_WORKSPACE/$IPK"
          fi
          ls -l
          tar xzf data.tar.gz -C /tmp/files-install
          VER=$(cat /tmp/files-install/usr/share/tkproxy/VERSION)
          echo "插件版本：$VER"
          [ "$VER" = "3.15.42" ] || { echo "::error::插件版本不是 3.15.42，实际 $VER"; exit 1; }
          chmod +x /tmp/files-install/etc/init.d/* 2>/dev/null || true
          find /tmp/files-install/usr/libexec/tkproxy -name '*.sh' -o -name '*.lua' | xargs -r chmod +x
          ls -l /tmp/files-install/etc/init.d/tkproxy /tmp/files-install/usr/share/tkproxy/VERSION
          grep -c . /tmp/files-install/usr/libexec/tkproxy/apply.sh

      - name: 注入 Xray-core 26.11.9（官方 arm64-v8a 静态二进制）
        run: |
          set -e
          cd /tmp
          ZURL=https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-arm64-v8a.zip
          curl -sSL --retry 3 --max-time 300 -o xray.zip "$ZURL"
          echo "64ed6858982a7f5eb85d88b811089063bd4f17561f4c8f44e0f1dc8e6f6430be  xray.zip" | sha256sum -c - || { echo "::error::xray zip sha256 不匹配"; exit 1; }
          unzip -o -q xray.zip xray -d xray-extract
          mkdir -p /tmp/files-install/usr/bin
          install -m 0755 xray-extract/xray /tmp/files-install/usr/bin/xray
          SZ=$(stat -c %s /tmp/files-install/usr/bin/xray)
          echo "注入的 xray 大小：$SZ 字节（期望 32964732）"
          [ "$SZ" -eq 32964732 ] || { echo "::error::xray 二进制大小异常"; exit 1; }
          sha256sum /tmp/files-install/usr/bin/xray

      - name: 构建镜像（内置 PassWall 25.12.16 + Xray 26.11.9）
        run: |
          set -e
          cd immortalwrt-imagebuilder-*
          PKGS="luci luci-compat curl ca-bundle xray-core luci-lua-runtime libuci-lua ip-full nftables firewall4 kmod-nft-tproxy kmod-nft-socket kmod-nf-tproxy kmod-veth luci-app-passwall luci-i18n-passwall-zh-cn trojan-plus hysteria tuic-client v2ray-core -dnsmasq dnsmasq-full"
          echo "PACKAGES=$PKGS"
          make image PROFILE=cmcc_rax3000m PACKAGES="$PKGS" FILES=/tmp/files-install > /tmp/ib.log 2>&1 || { echo "::error::构建失败"; tail -60 /tmp/ib.log; exit 1; }
          echo "--- 构建日志（包相关）---"
          grep -iE "passwall|Installing|Configuring" /tmp/ib.log | tail -25 || true
          echo "--- 产物 ---"
          ls -lh bin/targets/mediatek/filogic/*.itb
          ITB0=$(ls bin/targets/mediatek/filogic/*.itb | head -1)
          SZ=$(stat -c %s "$ITB0"); SM=$((SZ/1048576))
          echo "镜像大小：${SM} MB（NAND 128MB，ubi 分区 114MB）"
          if [ "$SM" -gt 100 ]; then echo "::error::镜像 ${SM}MB 过大，超过安全线 100MB，刷不进 128MB NAND"; exit 1; fi
          echo "--- 清单校验（必须是 25.12.16）---"
          MAN=$(ls bin/targets/mediatek/filogic/*.manifest | head -1)
          grep -iE "passwall|luci-app-tkproxy|argon" "$MAN" || true
          grep -qi "luci-app-passwall - 25.12.16" "$MAN" || { echo "::error::镜像里不是 25.12.16 版 PassWall"; grep -i passwall "$MAN" || true; exit 1; }

      - name: 发布到 Release（公开可下载）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd immortalwrt-imagebuilder-*
          ITB=$(ls bin/targets/mediatek/filogic/*cmcc_rax3000m*squashfs-sysupgrade.itb | head -1)
          TS=$(date +%Y%m%d-%H%M%S)
          TAG="pwx-$TS"
          SZ=$(stat -c %s "$ITB")
          REL=$(curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"BUER-WRT XR30 PassWall25.12.16 + Xray26.11.9 $TS\",\"body\":\"基底 ImmortalWrt 24.10.3，profile cmcc_rax3000m；luci-app-passwall 25.12.16-r1 + 中文包；Xray-core 26.11.9（官方 arm64-v8a 静态二进制，zip sha256 64ed6858…30be，解出 32964732 字节）；tkproxy + Argon。sha=${{ github.sha }}\"}")
          UP=$(echo "$REL" | jq -r .upload_url | sed 's/{?name,label}//')
          case "$UP" in http*) ;; *) echo "::error::建 release 失败：$(echo "$REL" | jq -r .message)"; exit 1 ;; esac
          URL=$(curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
            --data-binary @"$ITB" "$UP?name=buer-wrt-xr30-passwall-xray269-$TS.itb" | jq -r '.browser_download_url // .message')
          echo "下载地址：$URL"
          echo "产物大小：$SZ 字节"

      - name: 保存产物
        uses: actions/upload-artifact@v4
        with:
          name: xr30-passwall-itb
          path: immortalwrt-imagebuilder-*/bin/targets/mediatek/filogic/*.itb
